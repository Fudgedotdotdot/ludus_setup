### Debian Preseed Configuration for Ludus Installation
### Target: Debian 13 (trixie) with Switzerland mirror, then unattended Ludus install

#### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string CH
d-i localechooser/supported-locales multiselect en_US.UTF-8, de_CH.UTF-8, fr_CH.UTF-8, it_CH.UTF-8

#### Keyboard
d-i keyboard-configuration/xkb-keymap select us
d-i keyboard-configuration/layout select US
d-i keyboard-configuration/variant select

#### Network (DHCP; Ludus reconfigures this to a static address during install)
d-i netcfg/choose_interface select auto
d-i netcfg/dhcp_timeout string 60
d-i netcfg/dhcpv6_timeout string 60
d-i netcfg/get_hostname string ludus
d-i netcfg/get_domain string local
d-i netcfg/hostname string ludus
d-i netcfg/domain string local

#### Mirror (Switzerland)
d-i mirror/country string CH
d-i mirror/http/hostname string ftp.ch.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie

#### Account Setup (create the admin user)
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Fudge
d-i passwd/username string fudge
# SHA-512 crypt hash of the password "fudgeludus" (generate with: openssl passwd -6)
d-i passwd/user-password-crypted password $6$AnTwoPzL8q/i4RxC$isMqiOBtoJzc1uD4S0r5ZQe9.OLupjgjfgPjxmNyYfWEW1n7fAHSpZXpdsfyarqeIHg27u6Z3//Qr65xffO0q/
d-i passwd/user-uid string 1000
d-i user-setup/encrypt-home boolean false

#### Clock & Timezone
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Zurich
d-i clock-setup/ntp boolean true
d-i clock-setup/ntp-server string ch.pool.ntp.org

#### Partitioning (use the first disk, LVM)
# Auto-detect the target disk (works for /dev/sda, /dev/nvme0n1, /dev/vda, ...)
d-i partman/early_command string \
    debconf-set partman-auto/disk "$(list-devices disk | head -n1)"
d-i partman-auto/method string lvm
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

#### Package Selection
tasksel tasksel/first multiselect ssh-server, standard
d-i pkgsel/include string curl sudo ca-certificates
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select none

#### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

#### Finish Installation
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/halt boolean false
d-i debian-installer/exit/poweroff boolean false

#### Late Command - install the first-boot Ludus installer from the ISO
d-i preseed/late_command string \
    in-target mkdir -p /opt/ludus-install; \
    in-target cp /cdrom/auto-install.sh /opt/ludus-install/auto-install.sh; \
    in-target chmod 0755 /opt/ludus-install/auto-install.sh; \
    in-target cp /cdrom/ludus-firstboot.service /etc/systemd/system/ludus-firstboot.service; \
    in-target systemctl enable ludus-firstboot.service
